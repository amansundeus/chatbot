name: Chatbot app workflow

on:
  push:
    branches:
      - main

    paths:
      - "app.py"
      - "welcome.py"
      - "htmlTemplates.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".python-version"
      - ".github/workflows/deploy-chatbot.yml"

  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            --no-cache \
            -f Dockerfile \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot-app:${{ github.sha }} \
            .

      # 4. Push SHA-tagged image
      - name: Push SHA Image
        run: |
          docker push \
            ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot-app:${{ github.sha }}

      # 5. Create latest tag
      - name: Tag Image as Latest
        run: |
          docker tag \
            ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot-app:${{ github.sha }} \
            ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot-app:latest

      # 6. Push latest image
      - name: Push Latest Image
        run: |
          docker push \
            ${{ secrets.DOCKER_HUB_USERNAME }}/chatbot-app:latest

      # 7. Summary
      - name: Deployment Summary
        run: |
          echo "========================================="
          echo "Chatbot Docker image pushed successfully"
          echo "========================================="
          echo "Image:"
          echo "${{ secrets.DOCKER_HUB_USERNAME }}/chatbot-app:latest"
          echo ""
          echo "Commit SHA:"
          echo "${{ github.sha }}"
          echo ""
          echo "EC2 deployment is manual."
          echo "========================================="
